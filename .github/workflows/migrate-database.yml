name: Apply database migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore backend/Licenta.API/Licenta.API.csproj

      - name: Build project
        run: dotnet build backend/Licenta.API/Licenta.API.csproj --configuration Release --no-restore

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply database migration
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_TOPIC: ${{ secrets.MQTT_TOPIC }}
          MQTT_USE_TLS: ${{ secrets.MQTT_USE_TLS }}
        run: >
          dotnet ef database update
          --project backend/Licenta.API/Licenta.API.csproj
          --startup-project backend/Licenta.API/Licenta.API.csproj
          --connection "$POSTGRES_CONNECTION_STRING"